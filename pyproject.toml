[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-multi-agent-lab"
version = "0.1.0"
description = "A LangGraph-based multi-agent lab for e-commerce campaign decision making"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2.0,<2.0.0",
    "openai>=1.40.0,<3.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "fastapi>=0.112.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<10.0.0", "httpx>=0.27.0,<1.0.0"]

[project.scripts]
ecom-agent = "ecom_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
